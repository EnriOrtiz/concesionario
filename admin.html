<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Panel de Administración</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-app">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="sidebar-logo">
                    <i class="fas fa-crown"></i>
                </div>
                <div class="sidebar-brand-info">
                    <h1>Panel CMS</h1>
                    <span>v2.0 Profesional</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>

            <div class="sidebar-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar sección..." id="sidebarSearch">
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Principal</div>
                
                <a href="#" class="nav-item active" data-section="dashboard">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="nav-item" data-section="empresa">
                    <i class="fas fa-building"></i>
                    <span>Datos Empresa</span>
                </a>
                <a href="#" class="nav-item" data-section="apariencia">
                    <i class="fas fa-palette"></i>
                    <span>Apariencia</span>
                </a>

                <div class="nav-section-title">Contenido</div>

                <a href="#" class="nav-item" data-section="marcas">
                    <i class="fas fa-trademark"></i>
                    <span>Marcas</span>
                    <span class="nav-badge" id="badgeMarcas">0</span>
                </a>
                <a href="#" class="nav-item" data-section="vehiculos">
                    <i class="fas fa-car"></i>
                    <span>Vehículos</span>
                    <span class="nav-badge" id="badgeVehiculos">0</span>
                </a>
                <a href="#" class="nav-item" data-section="servicios">
                    <i class="fas fa-concierge-bell"></i>
                    <span>Servicios</span>
                    <span class="nav-badge" id="badgeServicios">0</span>
                </a>
                <a href="#" class="nav-item" data-section="secciones">
                    <i class="fas fa-toggle-on"></i>
                    <span>Secciones</span>
                </a>

                <div class="nav-section-title">Avanzado</div>

                <a href="#" class="nav-item" data-section="seo">
                    <i class="fas fa-magnifying-glass"></i>
                    <span>SEO</span>
                </a>
                <a href="#" class="nav-item" data-section="integraciones">
                    <i class="fas fa-plug"></i>
                    <span>Integraciones</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-stats">
                    <div class="stat-item">
                        <span class="stat-value" id="statVehiculos">0</span>
                        <span class="stat-label">Vehículos</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statMarcas">0</span>
                        <span class="stat-label">Marcas</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="statServicios">0</span>
                        <span class="stat-label">Servicios</span>
                    </div>
                </div>
                <div class="sidebar-actions">
                    <button class="btn btn-save" id="saveAllBtn">
                        <i class="fas fa-floppy-disk"></i> Guardar
                    </button>
                    <a href="index.html" class="btn btn-preview" target="_blank">
                        <i class="fas fa-eye"></i> Ver Sitio
                    </a>
                </div>
            </div>
        </aside>

        <!-- Contenido Principal -->
        <main class="admin-main">
            <!-- Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="btn-mobile-menu" id="mobileMenuBtn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="header-breadcrumb">
                        <span>CMS</span>
                        <i class="fas fa-chevron-right"></i>
                        <span id="breadcrumbSection">Dashboard</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-status" id="saveStatus">
                        <i class="fas fa-check-circle"></i>
                        <span>Todos los cambios guardados</span>
                    </div>
                    <div class="header-actions">
                        <button class="btn btn-icon-header" id="exportBtn" title="Exportar configuración">
                            <i class="fas fa-file-export"></i>
                        </button>
                        <button class="btn btn-icon-header" id="importBtn" title="Importar configuración">
                            <i class="fas fa-file-import"></i>
                        </button>
                        <input type="file" id="importFile" accept=".json" hidden>
                        <div class="header-divider"></div>
                        <div class="header-user">
                            <div class="user-avatar">
                                <i class="fas fa-user-cog"></i>
                            </div>
                            <span>Administrador</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Contenido dinámico -->
            <div class="admin-body" id="adminBody">
                <!-- Se renderiza dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Modal Genérico -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="modalContainer"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="admin-script.js"></script>
</body>
</html>
